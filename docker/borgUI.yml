services:
  app:
    image: ainullcode/borg-ui:latest
    container_name: borg-web-ui
    restart: unless-stopped
    ports:
      - "${PORT:-7081}:${PORT:-7081}"
    volumes:
      # Stores Borg UI configuration and internal databases
      - ${HOME}/appdata/borg-ui/data:/data
      # Stores the local Borg cache to speed up backup chunking
      - ${HOME}/appdata/borg-ui/cache:/home/borg/.cache/borg
      - /etc/localtime:/etc/localtime:ro
      # This maps your entire appdata directory so Borg UI can back up your other containers
      - ${HOME}/appdata:/local:rw
    environment:
      - PORT=${PORT:-7081}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - LOCAL_MOUNT_POINTS=${LOCAL_MOUNT_POINTS:-/local}
      - REDIS_HOST=disabled
    # privileged: true # Uncomment only if using SSHFS remote pull mode
