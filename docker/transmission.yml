---
services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TRANSMISSION_WEB_HOME= #optional
      - USER= dodgerassa
      - PASS= rycloud
      - RPC_WHITELIST_ENABLED= 127.168.1.*
    volumes:
      - /home/ryan-dodger/appdata/transmission/data:/config
      - /mnt/NAS/Transmission:/downloads #optional
     #- /path/to/watch/folder:/watch #optional
    #ports:
      #- 9091:9091
      #- 51413:51413
      #- 51413:51413/udp
    restart: unless-stopped
