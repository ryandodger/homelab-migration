# Localization & Timezone
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string America/Detroit
d-i clock-setup/utc boolean true

# Network Configuration
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string Ghidorah
d-i netcfg/get_domain string Local

# Mirror Settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Account Setup
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Serverkg
d-i passwd/username string Serverkg
# Password 'rycloud' hashed with SHA-512
d-i passwd/user-password-crypted password $6$rounds=50000$saltsalt$X7A33eE/eYcR1xR5D1xS5.3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N3Z4W4N

# Automated Partitioning (Main Disk)
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Unified Package List (Includes ntfs-3g, Samba, NFS, and system tools)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string tlp hdparm cpufrequtils ethtool git curl sudo samba samba-common-bin cifs-utils nfs-kernel-server nfs-common ntfs-3g rsync smartmontools lm-sensors sysstat ncdu linux-cpupower tmux unattended-upgrades ca-certificates
d-i pkgsel/upgrade select full-upgrade

# Post-Install Bootstrap Execution
d-i preseed/late_command string \
  in-target usermod -aG sudo Serverkg; \
  in-target mkdir -p /opt/homelab-migration; \
  in-target git clone https://github.com/ryandodger/homelab-migration.git /opt/homelab-migration; \
  in-target chmod +x /opt/homelab-migration/setup.sh; \
  in-target /opt/homelab-migration/setup.sh
